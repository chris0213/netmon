[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netmon"
dynamic = ["version"]
description = "macOS 网络断连定时监控与自动归因工具"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
netmon = "netmon.__main__:main"

[tool.setuptools.packages.find]
include = ["netmon*"]

# 版本号与 app / DMG 共用 netmon/__init__.py 的 __version__
[tool.setuptools.dynamic]
version = {attr = "netmon.__version__"}
